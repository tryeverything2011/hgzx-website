<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>黄冈中学校园网 — 首页</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="site-nav" id="siteNav"></header>

<!-- 校园全景图形象横幅（用户素材硬性要求：必须展示，响应式 object-fit） -->
<section class="hero">
  <img src="assets/campus-panorama.jpg" alt="黄冈中学校园全景">
  <div class="hero-mask"></div>
  <div class="hero-text">
    <h1>黄冈中学校园网</h1>
    <p>交流 · 分享 · 互助 · 成长</p>
  </div>
</section>

<!-- 重要通知滚动位 -->
<div class="notice-bar">
  <div class="notice-inner">
    <span class="notice-tag">📢 重要通知</span>
    <div class="notice-roll"><ul id="noticeList"></ul></div>
  </div>
</div>

<main class="wrap">
  <h2 class="section-title">功能模块</h2>
  <div class="module-grid" id="moduleGrid"></div>

  <h2 class="section-title">热门内容</h2>
  <div class="hot-list" id="hotList"></div>
</main>

<footer class="site-footer" id="siteFooter"></footer>

<script src="config.js"></script>
<script src="js/storage.js"></script>
<script src="js/permission.js"></script>
<script src="js/civility.js"></script>
<script src="js/auth.js"></script>
<script src="js/seed.js"></script>
<script src="js/common.js"></script>
<script src="js/home.js"></script>
</body>
</html>
