<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我有话对你说 — 黄冈中学校园网</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<header class="site-nav" id="siteNav"></header>

<main class="wrap module-page">
  <div class="module-head card" id="moduleHead"></div>

  <section class="composer card" id="composer" hidden>
    <select id="sayTarget" aria-label="选择留言对象"></select>
    <textarea id="sayInput" rows="3" maxlength="500" placeholder="写下你想说的话…"></textarea>
    <div class="composer-foot">
      <span></span>
      <button type="button" class="btn btn-primary" id="btnSend">发送留言</button>
    </div>
  </section>
  <p class="composer-tip" id="composerTip"></p>

  <div id="list"></div>
</main>

<footer class="site-footer" id="siteFooter"></footer>

<script src="../config.js"></script>
<script src="../js/storage.js"></script>
<script src="../js/permission.js"></script>
<script src="../js/civility.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/seed.js"></script>
<script src="../js/common.js"></script>
<script src="../js/chatui.js"></script>
<script src="../js/postui.js"></script>
<script src="../js/say.js"></script>
</body>
</html>
