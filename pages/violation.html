<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>网站违规通报 — 黄冈中学校园网</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<header class="site-nav" id="siteNav"></header>

<main class="wrap module-page">
  <div class="module-head card" id="moduleHead"></div>

  <section class="composer card" id="composer" hidden>
    <input type="text" id="vTitle" maxlength="60" placeholder="通报标题">
    <textarea id="vInput" rows="3" maxlength="800" placeholder="通报内容（违规行为与处理结果）…"></textarea>
    <div class="composer-foot">
      <span></span>
      <button type="button" class="btn btn-primary" id="btnPost">发布通报</button>
    </div>
  </section>
  <p class="composer-tip" id="composerTip"></p>

  <div class="filter-bar" id="vioTabs"></div>

  <div id="list"></div>
</main>

<footer class="site-footer" id="siteFooter"></footer>

<script src="../config.js"></script>
<script src="../js/storage.js"></script>
<script src="../js/permission.js"></script>
<script src="../js/civility.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/seed.js"></script>
<script src="../js/common.js"></script>
<script src="../js/postui.js"></script>
<script src="../js/violation.js"></script>
</body>
</html>
